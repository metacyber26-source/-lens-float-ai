<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensFloat AI - Floating Scanner & Translator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        .floating-anim {
            animation: pulse-slow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 text-center">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">LensFloat AI</h1>
        <p class="text-xs text-slate-400">Scanner, Pencerah Teks & Penerjemah Real-Time</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full flex flex-col gap-4">
        
        <!-- API Key Configuration -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
            <label class="block text-xs font-medium text-slate-400 mb-1">Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="Masukkan Gemini API Key Anda" class="w-full bg-slate-950 border border-slate-750 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Target Language Selection -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
            <span class="text-xs font-medium text-slate-400">Terjemahkan ke:</span>
            <select id="targetLang" class="bg-slate-950 border border-slate-750 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                <option value="Indonesia">Bahasa Indonesia</option>
                <option value="English">English</option>
                <option value="Mandarin">Mandarin (中文)</option>
            </select>
        </div>

        <!-- Image Upload / Capture Area -->
        <div class="border-2 border-dashed border-slate-800 rounded-2xl p-6 text-center bg-slate-900/50 flex flex-col items-center justify-center relative">
            <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
            <div id="placeholderView" class="flex flex-col items-center">
                <svg class="w-10 h-10 text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <p class="text-sm font-medium text-slate-300">Ketuk untuk Ambil Foto / Upload Screenshot</p>
                <p class="text-xs text-slate-500 mt-1">Mendukung teks blur, buram, atau bahasa asing</p>
            </div>
            <div id="previewContainer" class="hidden w-full flex flex-col items-center">
                <img id="imagePreview" class="max-h-48 rounded-lg object-contain mb-2 border border-slate-700">
                <button onclick="resetImage()" class="text-xs text-red-400 hover:underline">Ganti Gambar</button>
            </div>
        </div>

        <!-- Action Button -->
        <button onclick="processImage()" id="processBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-blue-900/20 disabled:opacity-50" disabled>
            Proses & Terjemahkan
        </button>

        <!-- Results Area -->
        <div id="resultSection" class="hidden flex flex-col gap-3">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-semibold text-blue-400">Teks Asli Terdeteksi:</span>
                    <button onclick="copyText('originalText')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded">Salin</button>
                </div>
                <p id="originalText" class="text-sm text-slate-200 whitespace-pre-wrap select-all"></p>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-semibold text-emerald-400">Hasil Terjemahan:</span>
                    <button onclick="copyText('translatedText')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded">Salin</button>
                </div>
                <p id="translatedText" class="text-sm text-slate-200 whitespace-pre-wrap select-all"></p>
            </div>
        </div>
    </main>

    <!-- Floating Action Button (Simulasi Widget Mengambang) -->
    <div id="floatingWidget" class="fixed bottom-6 right-6 z-50">
        <button onclick="scrollToTop()" class="floating-anim bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-full shadow-2xl flex items-center justify-center border-2 border-blue-400/30">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </button>
    </div>

    <!-- Script Logika -->
    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const placeholderView = document.getElementById('placeholderView');
        const previewContainer = document.getElementById('previewContainer');
        const processBtn = document.getElementById('processBtn');
        const resultSection = document.getElementById('resultSection');
        
        let base64Image = null;

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result.split(',')[1];
                    imagePreview.src = event.target.result;
                    placeholderView.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                    processBtn.disabled = false;
                }
                reader.readAsDataURL(file);
            }
        });

        function resetImage() {
            imageInput.value = '';
            base64Image = null;
            imagePreview.src = '';
            placeholderView.classList.remove('hidden');
            previewContainer.classList.add('hidden');
            processBtn.disabled = true;
            resultSection.classList.add('hidden');
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            imageInput.click();
        }

        async function processImage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const targetLang = document.getElementById('targetLang').value;

            if (!apiKey) {
                alert('Mohon masukkan Gemini API Key terlebih dahulu!');
                return;
            }

            if (!base64Image) {
                alert('Mohon pilih gambar terlebih dahulu!');
                return;
            }

            processBtn.disabled = true;
            processBtn.textContent = 'Memproses & Menjernihkan Teks...';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                {
                                    text: `Tugas Anda adalah bertindak sebagai OCR cerdas dan translator profesional. 
                                    1. Analisis gambar ini meskipun teksnya buram, kurang jelas, atau miring. 
                                    2. Ekstrak dan perbaiki teks asli yang ada di dalam gambar dengan akurat.
                                    3. Terjemahkan teks tersebut ke dalam bahasa ${targetLang}.
                                    Format jawaban wajib menggunakan format JSON murni tanpa markdown backticks seperti ini:
                                    {"original": "teks asli hasil ekstrak", "translated": "hasil terjemahan"}`
                                },
                                {
                                    inline_data: {
                                        mime_type: "image/jpeg",
                                        data: base64Image
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                
                // Bersihkan markdown jika ada
                const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const result = JSON.parse(cleanJson);

                document.getElementById('originalText').textContent = result.original;
                document.getElementById('translatedText').textContent = result.translated;
                resultSection.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                alert('Terjadi kesalahan saat memproses gambar. Periksa kembali API Key Anda.');
            } finally {
                processBtn.disabled = false;
                processBtn.textContent = 'Proses & Terjemahkan';
            }
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Teks berhasil disalin ke clipboard!');
            });
        }
    </script>
</body>
</html>
